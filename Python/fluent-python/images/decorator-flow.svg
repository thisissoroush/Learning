<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <rect width="760" height="440" fill="#1e1e2e"/>
  <text x="380" y="38" text-anchor="middle" fill="#cdd6f4" font-size="19" font-weight="bold" font-family="monospace">Decorator Execution Flow</text>

  <!-- Source code box -->
  <rect x="30" y="65" width="320" height="120" rx="8" fill="#313244" stroke="#6c7086" stroke-width="1.5"/>
  <text x="190" y="88" text-anchor="middle" fill="#6c7086" font-size="11" font-family="monospace">Source Code</text>
  <text x="55" y="110" fill="#cba6f7" font-size="12" font-family="monospace">@clock</text>
  <text x="55" y="130" fill="#89b4fa" font-size="12" font-family="monospace">def factorial(n):</text>
  <text x="55" y="150" fill="#cdd6f4" font-size="12" font-family="monospace">    return 1 if n &lt; 2 else</text>
  <text x="55" y="170" fill="#cdd6f4" font-size="12" font-family="monospace">        n * factorial(n-1)</text>

  <!-- Arrow 1 -->
  <text x="380" y="130" text-anchor="middle" fill="#a6e3a1" font-size="12" font-family="monospace">import time</text>
  <line x1="350" y1="125" x2="405" y2="125" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a6e3a1"/>
    </marker>
  </defs>

  <!-- What Python sees box -->
  <rect x="410" y="65" width="320" height="120" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="570" y="88" text-anchor="middle" fill="#f38ba8" font-size="11" font-family="monospace">What Python actually does</text>
  <text x="430" y="110" fill="#cdd6f4" font-size="11" font-family="monospace">def factorial(n):</text>
  <text x="430" y="128" fill="#cdd6f4" font-size="11" font-family="monospace">    return 1 if n &lt; 2 else</text>
  <text x="430" y="146" fill="#cdd6f4" font-size="11" font-family="monospace">        n * factorial(n-1)</text>
  <text x="430" y="166" fill="#cba6f7" font-size="11" font-family="monospace">factorial = clock(factorial)</text>

  <!-- Closure internals -->
  <rect x="30" y="230" width="700" height="150" rx="10" fill="#181825" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="380" y="255" text-anchor="middle" fill="#89b4fa" font-size="13" font-weight="bold" font-family="monospace">Inside clock() — The Closure</text>

  <rect x="50" y="268" width="300" height="95" rx="6" fill="#313244"/>
  <text x="80" y="288" fill="#cba6f7" font-size="11" font-family="monospace">def clock(func):          # outer</text>
  <text x="80" y="306" fill="#a6adc8" font-size="11" font-family="monospace">    @functools.wraps(func)</text>
  <text x="80" y="322" fill="#89b4fa" font-size="11" font-family="monospace">    def clocked(*args):   # inner</text>
  <text x="80" y="338" fill="#cdd6f4" font-size="11" font-family="monospace">        t = perf_counter()</text>
  <text x="80" y="354" fill="#cdd6f4" font-size="11" font-family="monospace">        result = func(*args)</text>

  <rect x="380" y="268" width="330" height="95" rx="6" fill="#313244"/>
  <text x="400" y="288" fill="#a6adc8" font-size="11" font-family="monospace">func is a FREE VARIABLE</text>
  <text x="400" y="306" fill="#a6adc8" font-size="11" font-family="monospace">captured in the closure cell</text>
  <text x="400" y="326" fill="#a6e3a1" font-size="11" font-family="monospace">clocked.__closure__[0]</text>
  <text x="400" y="344" fill="#a6e3a1" font-size="11" font-family="monospace">  → the original factorial</text>
  <text x="400" y="362" fill="#f9e2af" font-size="10" font-family="monospace">@wraps preserves __name__, __doc__</text>

  <!-- Bottom note -->
  <rect x="30" y="400" width="700" height="28" rx="6" fill="#181825"/>
  <text x="380" y="419" text-anchor="middle" fill="#585b70" font-size="11" font-family="monospace">Decorator runs at IMPORT TIME · Wrapper runs at CALL TIME · Use @functools.wraps always</text>
</svg>
