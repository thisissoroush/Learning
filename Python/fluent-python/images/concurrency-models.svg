<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <rect width="860" height="520" fill="#1e1e2e"/>
  <text x="430" y="40" text-anchor="middle" fill="#cdd6f4" font-size="20" font-weight="bold" font-family="monospace">Python Concurrency Models</text>

  <!-- Threading column -->
  <rect x="30" y="70" width="240" height="380" rx="10" fill="#181825" stroke="#a6e3a1" stroke-width="2"/>
  <text x="150" y="100" text-anchor="middle" fill="#a6e3a1" font-size="15" font-weight="bold" font-family="monospace">Threading</text>
  <text x="150" y="120" text-anchor="middle" fill="#585b70" font-size="11" font-family="monospace">import threading</text>
  <!-- thread visual -->
  <rect x="60" y="140" width="60" height="20" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="90" y="154" text-anchor="middle" fill="#cdd6f4" font-size="9" font-family="monospace">Thread 1</text>
  <rect x="150" y="140" width="60" height="20" rx="4" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="180" y="154" text-anchor="middle" fill="#585b70" font-size="9" font-family="monospace">Thread 2</text>
  <rect x="60" y="170" width="60" height="20" rx="4" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="90" y="184" text-anchor="middle" fill="#585b70" font-size="9" font-family="monospace">Thread 3</text>

  <text x="150" y="215" text-anchor="middle" fill="#f9e2af" font-size="10" font-family="monospace">GIL: one thread</text>
  <text x="150" y="230" text-anchor="middle" fill="#f9e2af" font-size="10" font-family="monospace">runs at a time</text>

  <rect x="55" y="250" width="180" height="90" rx="6" fill="#313244"/>
  <text x="145" y="270" text-anchor="middle" fill="#a6e3a1" font-size="11" font-weight="bold" font-family="monospace">✅ Best for</text>
  <text x="145" y="288" text-anchor="middle" fill="#cdd6f4" font-size="10" font-family="monospace">I/O-bound work</text>
  <text x="145" y="304" text-anchor="middle" fill="#cdd6f4" font-size="10" font-family="monospace">Network / disk waits</text>
  <text x="145" y="320" text-anchor="middle" fill="#cdd6f4" font-size="10" font-family="monospace">Simple concurrency</text>

  <rect x="55" y="355" width="180" height="70" rx="6" fill="#313244"/>
  <text x="145" y="374" text-anchor="middle" fill="#f38ba8" font-size="11" font-weight="bold" font-family="monospace">❌ Not for</text>
  <text x="145" y="392" text-anchor="middle" fill="#cdd6f4" font-size="10" font-family="monospace">CPU-bound computation</text>
  <text x="145" y="408" text-anchor="middle" fill="#cdd6f4" font-size="10" font-family="monospace">(GIL prevents parallel)</text>

  <!-- Multiprocessing column -->
  <rect x="310" y="70" width="240" height="380" rx="10" fill="#181825" stroke="#fab387" stroke-width="2"/>
  <text x="430" y="100" text-anchor="middle" fill="#fab387" font-size="15" font-weight="bold" font-family="monospace">Multiprocessing</text>
  <text x="430" y="120" text-anchor="middle" fill="#585b70" font-size="11" font-family="monospace">from multiprocessing import ...</text>

  <rect x="340" y="140" width="60" height="20" rx="4" fill="#313244" stroke="#fab387" stroke-width="1"/>
  <text x="370" y="154" text-anchor="middle" fill="#cdd6f4" font-size="9" font-family="monospace">Process 1</text>
  <rect x="415" y="140" width="60" height="20" rx="4" fill="#313244" stroke="#fab387" stroke-width="1"/>
  <text x="445" y="154" text-anchor="middle" fill="#cdd6f4" font-size="9" font-family="monospace">Process 2</text>
  <text x="350" y="180" text-anchor="middle" fill="#585b70" font-size="9" font-family="monospace">own GIL</text>
  <text x="430" y="180" text-anchor="middle" fill="#585b70" font-size="9" font-family="monospace">own GIL</text>

  <text x="430" y="210" text-anchor="middle" fill="#a6e3a1" font-size="10" font-family="monospace">True parallelism</text>
  <text x="430" y="226" text-anchor="middle" fill="#a6e3a1" font-size="10" font-family="monospace">across CPU cores</text>

  <rect x="335" y="250" width="180" height="90" rx="6" fill="#313244"/>
  <text x="425" y="270" text-anchor="middle" fill="#a6e3a1" font-size="11" font-weight="bold" font-family="monospace">✅ Best for</text>
  <text x="425" y="288" text-anchor="middle" fill="#cdd6f4" font-size="10" font-family="monospace">CPU-bound work</text>
  <text x="425" y="304" text-anchor="middle" fill="#cdd6f4" font-size="10" font-family="monospace">Image/video processing</text>
  <text x="425" y="320" text-anchor="middle" fill="#cdd6f4" font-size="10" font-family="monospace">Heavy computation</text>

  <rect x="335" y="355" width="180" height="70" rx="6" fill="#313244"/>
  <text x="425" y="374" text-anchor="middle" fill="#f38ba8" font-size="11" font-weight="bold" font-family="monospace">❌ Not for</text>
  <text x="425" y="392" text-anchor="middle" fill="#cdd6f4" font-size="10" font-family="monospace">High-concurrency I/O</text>
  <text x="425" y="408" text-anchor="middle" fill="#cdd6f4" font-size="10" font-family="monospace">(overhead too high)</text>

  <!-- Asyncio column -->
  <rect x="590" y="70" width="240" height="380" rx="10" fill="#181825" stroke="#89b4fa" stroke-width="2"/>
  <text x="710" y="100" text-anchor="middle" fill="#89b4fa" font-size="15" font-weight="bold" font-family="monospace">Asyncio</text>
  <text x="710" y="120" text-anchor="middle" fill="#585b70" font-size="11" font-family="monospace">import asyncio</text>

  <!-- Event loop visual -->
  <circle cx="710" cy="175" r="38" fill="none" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="710" y="170" text-anchor="middle" fill="#89b4fa" font-size="10" font-family="monospace">Event</text>
  <text x="710" y="184" text-anchor="middle" fill="#89b4fa" font-size="10" font-family="monospace">Loop</text>

  <text x="710" y="230" text-anchor="middle" fill="#a6adc8" font-size="10" font-family="monospace">Single thread</text>
  <text x="710" y="244" text-anchor="middle" fill="#a6adc8" font-size="10" font-family="monospace">cooperative multitasking</text>

  <rect x="615" y="260" width="180" height="90" rx="6" fill="#313244"/>
  <text x="705" y="280" text-anchor="middle" fill="#a6e3a1" font-size="11" font-weight="bold" font-family="monospace">✅ Best for</text>
  <text x="705" y="298" text-anchor="middle" fill="#cdd6f4" font-size="10" font-family="monospace">High-concurrency I/O</text>
  <text x="705" y="314" text-anchor="middle" fill="#cdd6f4" font-size="10" font-family="monospace">1000s of connections</text>
  <text x="705" y="330" text-anchor="middle" fill="#cdd6f4" font-size="10" font-family="monospace">Low overhead</text>

  <rect x="615" y="365" width="180" height="70" rx="6" fill="#313244"/>
  <text x="705" y="384" text-anchor="middle" fill="#f38ba8" font-size="11" font-weight="bold" font-family="monospace">❌ Not for</text>
  <text x="705" y="402" text-anchor="middle" fill="#cdd6f4" font-size="10" font-family="monospace">CPU-bound work</text>
  <text x="705" y="418" text-anchor="middle" fill="#cdd6f4" font-size="10" font-family="monospace">(blocks event loop)</text>

  <!-- Bottom note -->
  <text x="430" y="480" text-anchor="middle" fill="#585b70" font-size="11" font-family="monospace">All three unified under concurrent.futures.Executor API</text>
</svg>
